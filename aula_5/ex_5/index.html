<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let a = 10;
      let b = 3;
      console.log(a + b); // 13
      console.log(a - b); // 7
      console.log(a * b); // 30
      console.log(a / b); // 3.3333333333333335
      console.log(a % b); // 1
      console.log(a ** 2); // 100
      let c = 5;
      c++;
      console.log(c); // 6
      c--;
      console.log(c); // 5
      c += 10;
      console.log(c); // 15
      // Juntando textos (concatenação)
      let nome = "João";
      let sobrenome = "Silva";
      console.log(nome + " " + sobrenome); // João Silva
    </script>
  </body>
</html>
