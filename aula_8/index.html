<!doctype html>
<html lang="pt-br">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integração com backend</title>

    <link rel="stylesheet" href="style.css">

    <!-- Scripts JS -->

    <script src="api.js" defer></script>
    <script src="pagina.js" defer></script>

  <body>
    <h1>Pesquisa de Séries</h1>

    <p id="mensagem"></p>

    <table>
      <thead>
        <tr>
          <th>CAPA</th>
          <th>NOME</th>
          <th>URL</th>
        </tr>
      </thead>
      <tbody id="tabela">
        <!-- É aqui que tudo vai ser criado. -->
      </tbody>
    </table>
  </body>
</html>
